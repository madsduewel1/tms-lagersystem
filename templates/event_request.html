{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto pb-8">
    <div class="mb-6">
        <h1 class="text-2xl sm:text-3xl font-semibold flex items-center gap-3">
            <i class="fas fa-calendar-plus text-pink-400"></i>
            <span>Event-Anfrage</span>
        </h1>
        <p class="text-sm text-gray-500 mt-2">Hier kannst du unverbindlich eine Veranstaltung anfragen. Wir melden uns anschließend bei dir.</p>
    </div>

    <form method="POST" action="{{ url_for('event_request') }}" class="space-y-5">
        <div class="hidden" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 sm:p-6 space-y-4">
            <h2 class="text-sm font-medium text-gray-300 flex items-center gap-2">
                <i class="fas fa-info-circle text-blue-400"></i>Veranstaltung
            </h2>

            <div>
                <label class="block text-xs text-gray-400 mb-2" for="event_name">Veranstaltungsname *</label>
                <input type="text" id="event_name" name="event_name" required
                       value="{{ form.get('event_name', '') }}"
                       placeholder="z. B. Sommerkonzert"
                       class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-2" for="organizer">Veranstalter / Organisation</label>
                    <input type="text" id="organizer" name="organizer"
                           value="{{ form.get('organizer', '') }}"
                           placeholder="Optional"
                           class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-2" for="location">Ort / Aufbauort</label>
                    <input type="text" id="location" name="location"
                           value="{{ form.get('location', '') }}"
                           placeholder="z. B. Stadtpark"
                           class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-2" for="start_at">Beginn *</label>
                    <input type="datetime-local" id="start_at" name="start_at" required
                           value="{{ form.get('start_at', '') }}"
                           class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-2" for="end_at">Ende (optional)</label>
                    <input type="datetime-local" id="end_at" name="end_at"
                           value="{{ form.get('end_at', '') }}"
                           class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-2" for="description">Beschreibung / benötigte Technik</label>
                <textarea id="description" name="description" rows="4"
                          placeholder="Ablauf, gewünschte Technik, Aufbauzeit…"
                          class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">{{ form.get('description', '') }}</textarea>
            </div>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 sm:p-6 space-y-4">
            <h2 class="text-sm font-medium text-gray-300 flex items-center gap-2">
                <i class="fas fa-address-book text-emerald-400"></i>Kontakt
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-2" for="contact_name">Name *</label>
                    <input type="text" id="contact_name" name="contact_name" required
                           value="{{ form.get('contact_name', '') }}"
                           placeholder="Vor- und Nachname"
                           class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-2" for="email">E-Mail *</label>
                    <input type="email" id="email" name="email" required
                           value="{{ form.get('email', '') }}"
                           placeholder="name@beispiel.de"
                           class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-2" for="phone">Telefon (optional)</label>
                <input type="tel" id="phone" name="phone"
                       value="{{ form.get('phone', '') }}"
                       placeholder="z. B. 0170 1234567"
                       class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-pink-500 focus:outline-none">
            </div>
        </div>

        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 p-3.5 rounded-lg font-medium transition">
            <i class="fas fa-paper-plane mr-2"></i>Anfrage senden
        </button>
        <p class="text-xs text-gray-600 text-center">Pflichtfelder sind mit * markiert.</p>
    </form>
</div>
{% endblock %}
