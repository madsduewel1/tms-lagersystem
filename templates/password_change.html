{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-0 pb-8">
    <div class="mb-6">
        <h1 class="text-2xl sm:text-3xl font-semibold flex items-center gap-3">
            <i class="fas fa-key text-amber-400"></i>
            <span>Passwort ändern</span>
        </h1>
        <p class="text-sm text-gray-500 mt-1">Angemeldet als {{ session.user_id }}</p>
    </div>

    <form method="POST" class="bg-gray-900 border border-gray-800 rounded-xl p-5 sm:p-6 space-y-4">
        <div>
            <label class="block text-xs text-gray-400 mb-2" for="current_password">Aktuelles Passwort</label>
            <input type="password" id="current_password" name="current_password" required
                   class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-amber-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-xs text-gray-400 mb-2" for="new_password">Neues Passwort</label>
            <input type="password" id="new_password" name="new_password" required
                   class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-amber-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-xs text-gray-400 mb-2" for="confirm_password">Neues Passwort wiederholen</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 focus:border-amber-500 focus:outline-none">
        </div>

        <button type="submit"
                class="w-full bg-amber-600 hover:bg-amber-700 p-3 rounded-lg font-medium transition">
            <i class="fas fa-save mr-2"></i>Passwort speichern
        </button>
    </form>

    <a href="{{ base_path }}/dashboard"
       class="inline-flex items-center mt-6 text-sm text-gray-400 hover:text-white transition">
        <i class="fas fa-arrow-left mr-2"></i>Zurück zum Dashboard
    </a>
</div>
{% endblock %}
