# TMS Event-Technik Lager unter /lagersystem
# SPA statisch ausgeliefert, API an Backend (Port 3000) weitergereicht.
# Wird von install.sh nach /etc/apache2/lagersystem-snippet.conf kopiert.
# Nach einem Frontend-Build: sudo cp -r frontend/dist /opt/lagersystem/frontend/dist

RedirectMatch 301 ^/lagersystem$ /lagersystem/

ProxyPreserveHost On
ProxyPass /lagersystem/api/ http://127.0.0.1:3000/api/
ProxyPassReverse /lagersystem/api/ http://127.0.0.1:3000/api/

Alias /lagersystem /opt/lagersystem/frontend/dist
<Directory /opt/lagersystem/frontend/dist>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    RewriteEngine On
    RewriteBase /lagersystem/
    RewriteRule ^index\.html$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /lagersystem/index.html [L]
</Directory>